# Sample Configuration for InstMarker Pass
# Place this in your Rust project's .cargo/config.toml

[build]
# Path to your custom rustc build with InstMarker pass
rustc = "/path/to/custom/rustc"

# Base target configuration with common settings
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    # Default pass configuration - works for most cases
    "-C", "passes=unsafe-analysis-pass,instmarker",
    
    # Common library paths
    "-C", "link-arg=-L/path/to/llvm/build/lib",
    "-C", "link-arg=-Wl,-rpath,/path/to/llvm/build/lib"
]

# Debug builds (O0) - for coverage analysis
[target.'cfg(debug_assertions)'.x86_64-unknown-linux-gnu]
rustflags = [
    # Run analysis then coverage-focused passes
    "-C", "passes=unsafe-analysis-pass,instmarker,dynamic-line-count",
    
    # Library paths
    "-C", "link-arg=-L/path/to/llvm/build/lib",
    "-C", "link-arg=-Wl,-rpath,/path/to/llvm/build/lib",
    
    # Runtime libraries for coverage
    "-C", "link-arg=-lLLVMDynamicLineCountRuntime"
]

# Release builds (O3) - for memory access tracking
[target.'cfg(not(debug_assertions))'.x86_64-unknown-linux-gnu]
rustflags = [
    # Run analysis then performance-focused passes
    "-C", "passes=unsafe-analysis-pass,instmarker,heap-tracker",
    
    # Library paths
    "-C", "link-arg=-L/path/to/llvm/build/lib",
    "-C", "link-arg=-Wl,-rpath,/path/to/llvm/build/lib"
]

# Ensure debug builds use O0
[profile.dev]
opt-level = 0
debug = true

# Optimize release builds
[profile.release]
opt-level = 3
lto = "thin"  # Thin LTO for better build times with similar performance
codegen-units = 1

# Usage instructions:
# - For coverage testing (O0 with dynamic-line-count): 
#   cargo build
#
# - For memory tracking (O3 with heap-tracker): 
#   cargo build --release
#
# - For DWARF stack unwinding with unsafe blocks identified:
#   RUSTFLAGS="-C debuginfo=2" cargo build --release
#
# Note: Cargo merges rustflags from multiple matching target sections,
# but later sections can override earlier ones. Be careful with duplicates.